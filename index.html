<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Painel Frota</title>

<style>

/* ================= ROOT ================= */

:root{

  --bg:#071029;
  --card:#0b1a3a;
  --table:#0e224d;
  --table-alt:#0c1d40;
  --header:#2c4078;
  --border:#1e2f5c;

  --text:#ffffff;
  --muted:#9fb3ff;

  --green:#00ff9c;
  --yellow:#ffcc00;
  --red:#ff4d4d;
  --lime:#7CFC00;
}

/* ================= RESET ================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  background:var(--bg);
  color:var(--text);

  font-family:Inter,Arial,sans-serif;

  height:100vh;
  overflow:hidden;
}

/* ================= HEADER ================= */

.topbar{

  display:grid;

  grid-template-columns:
    180px 1fr 250px;

  gap:16px;

  align-items:center;

  padding:14px 20px;

  background:#020617;

  border-bottom:
    1px solid rgba(255,255,255,.1);
}

/* LEFT */

.left{
  display:flex;
  align-items:center;
}

.logo{
  height:65px;
  object-fit:contain;
}

/* CENTER */

.center{

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;
}

.title{

  font-size:30px;
  font-weight:700;

  letter-spacing:1px;
}

/* STATUS EMPREGADOS */

#status-empregados{

  display:flex;
  flex-wrap:wrap;

  justify-content:center;

  gap:20px;

  margin-top:10px;
}

.badge{

  padding:6px 10px;

  border-radius:10px;

  font-size:16px;
  font-weight:700;
}

.ocupado{
  background:rgba(255,77,77,.15);
  color:var(--red);
}

.livre{
  background:rgba(0,255,156,.15);
  color:var(--green);
}

/* RIGHT */

.right{

  display:flex;
  flex-direction:column;

  align-items:flex-end;

  gap:10px;
}

#clock{

  font-size:24px;
  font-weight:700;

  color:var(--muted);
}

.actions{

  display:flex;
  gap:10px;
}

button{

  border:none;
  border-radius:10px;

  padding:8px 14px;

  cursor:pointer;

  font-weight:700;

  transition:.2s;
}

button:hover{
  transform:scale(1.03);
}

/* BUTTON OFF */

button.off{

  background:#ff4d4d;

  color:#ffffff;

  box-shadow:
    0 0 10px rgba(255,77,77,.5);
}

/* ================= MAIN ================= */

main{

  display:grid;

  gap:14px;

  padding:12px;

  height:calc(100vh - 120px);

  overflow:auto;
}

/* ================= GRID GERAL ================= */

.grid-geral{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;
  
  /* limita para apenas 1 linha */
  grid-auto-rows:2;
  
}

/* ================= CARD ================= */

.card{

  background:var(--card);

  border-radius:16px;

  overflow:auto;

  border:
    1px solid rgba(255,255,255,.08);

  box-shadow:
    0 4px 20px rgba(0,0,0,.35);
}

.card h2{

  text-align:center;

  padding:12px;

  font-size:22px;
}

/* ================= TABLE ================= */

table{

  width:100%;

  border-collapse:collapse;
}

thead th{

  position:sticky;
  top:0;

  background:var(--header);

  padding:12px;

  border:
    1px solid var(--border);

  font-size:15px;
}

tbody td{

  padding:12px;

  border:
    1px solid var(--border);

  background:var(--table);

  text-align:center;
}

tbody tr:nth-child(even) td{
  background:var(--table-alt);
}

/* ================= STATUS ROWS ================= */

.status-atendido td{
  background:rgba(0,255,156,.10);
}

.status-andamento td{
  background:rgba(255,204,0,.10);
}

.status-cancelado td{
  background:rgba(255,77,77,.12);
}

.status-concluido td{
  background:rgba(124,252,0,.10);
}

.status-manutencao td{
  background:rgba(255,140,0,.10);
}

/* ================= STATUS ICON ================= */

.status-icon{

  font-size:24px;

  font-weight:700;

  text-align:center;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

  .topbar{

    grid-template-columns:auto auto auto;

    text-align:center;
  }

  .left,
  .center,
  .right{

    justify-content:center;
    align-items:center;
  }

  .right{
    align-items:center;
  }

  .title{
    font-size:12px;
  }

  #status-empregados{

    gap:4px;

    margin-top:6px;
  }

  #status-empregados .badge{

    font-size:8px;

    padding:3px 6px;

    border-radius:6px;
  }

  #clock{
    font-size:8px;
  }

  .logo{
    height:20px;
  }

  .actions button{

    font-size:4px;

    padding:4px 6px;

    border-radius:2px;
  }

  table{
    font-size:10px;
  }

  thead th,
  tbody td{
    padding:8px;
  }

  .card h2{
    font-size:12px;
  }

  .grid-geral{
    grid-template-columns:1fr;
  }

  .status-icon{
    font-size:18px;
  }
}

</style>

</head>

<body>

<audio id="beep" preload="auto">
  <source src="./alerta.mp3" type="audio/mpeg">
</audio>

<!-- ================= HEADER ================= -->

<header class="topbar">

  <div class="left">

    <img
      src="logo.png"
      class="logo"
      onerror="this.style.display='none'"
    >

  </div>

  <div class="center">

    <div class="title">
      MOVIMENTAÇÃO DIÁRIA
    </div>

    <div id="status-empregados"></div>

  </div>

  <div class="right">

    <div id="clock"></div>

    <div class="actions">

      <button id="toggle-audio">
        🔊 SOM ON
      </button>

      <button id="toggle-fullscreen">
        ⛶ TELA CHEIA
      </button>

    </div>

  </div>

</header>

<!-- ================= MAIN ================= -->

<main id="app"></main>

<script>

/* ================= CONFIG ================= */

const CONFIG = {

  SHEET_ID:
    "1Ch3AjQ0MDo4WuQWFDR3r8nZrHb4yQkSLOtT5_QgxT6E",

  REFRESH_INTERVAL:30000
};

/* ================= TABS ================= */

const TABS = [

  {
    id:"geral",
    sheet:"GERAL"
    
  },

  {
    id:"painel",
    title:"PAINEL",
    sheet:"PAINEL",

    headers:[
      "Data",
      "Hora",
      "Veículo",
      "Empregado",
      "Passageiro/ Setor/ Motivo",
      "Itinerário",
      "Status"
    ]
  },

  {
    id:"agenda",
    title:"AGENDA DO DIA",
    sheet:"AGENDA DO DIA",

    headers:[
      "Data",
      "Hora",
      "Passageiro",
      "Setor",
      "Motivo",
      "Itinerário",
      "Status"
    ]
  },

  {
    id:"social",
    title:"AGENDA SERVIÇO SOCIAL",
    sheet:"AGENDA SERVIÇO SOCIAL",

    headers:[
      "Data",
      "Período",
      "Passageiro",
      "Motivo",
      "Itinerário",
      "Status"
    ]
  }
];

/* ================= STATUS ================= */

const STATUS_MAP = {

  atendido:{
    icon:"✔",
    class:"status-atendido"
  },

  concluido:{
    icon:"✔",
    class:"status-concluido"
  },

  andamento:{
    icon:"⏳",
    class:"status-andamento"
  },

  cancelado:{
    icon:"✖",
    class:"status-cancelado"
  },

  manutenção:{
    icon:"🔧",
    class:"status-manutencao"
  }
};

const EMPREGADOS = [
  "CACIO",
  "CELSO",
  "NEI"
];

/* ================= UTILS ================= */

const parseGviz = txt =>

  JSON.parse(
    txt.slice(
      txt.indexOf("{"),
      txt.lastIndexOf("}") + 1
    )
  );

const getCellValue = c =>
  c?.f ?? c?.v ?? "";

const getStatusKey = (status="") =>

  Object.keys(STATUS_MAP)
    .find(key =>
      status.toLowerCase().includes(key)
    );

const getStatusInfo = status =>
  STATUS_MAP[getStatusKey(status)] || {};

/* ================= FETCH ================= */

async function fetchSheet(sheet){

  const url =

    `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq` +

    `?sheet=${encodeURIComponent(sheet)}` +

    `&tqx=out:json`;

  const res = await fetch(url);

  if(!res.ok){
    throw new Error("Erro ao carregar dados");
  }

  return parseGviz(await res.text());
}

/* ================= TABLE ================= */

function renderTable({headers,rows}){

  return `

    <table>

      <thead>

        <tr>

          ${headers.map(h => `
            <th>${h}</th>
          `).join("")}

        </tr>

      </thead>

      <tbody>

        ${rows.map(renderRow).join("")}

      </tbody>

    </table>
  `;
}

function renderRow(row){

  const values =
    (row.c || []).map(getCellValue);

  if(
    values.every(v =>
      !String(v).trim()
    )
  ){
    return "";
  }

  const status =
    values.at(-1);

  const {
    icon = "",
    class:css = ""
  } = getStatusInfo(status);

  return `

    <tr class="${css}">

      ${values.map((v,i)=>`

        <td class="
          ${i === values.length - 1
            ? "status-icon"
            : ""}
        ">

          ${i === values.length - 1
            ? icon
            : v}

        </td>

      `).join("")}

    </tr>
  `;
}

/* ================= EMPREGADOS ================= */

function renderEmpregados(rows){

  const ocupados =
    new Set();

  rows.forEach(r=>{

    const text =
      JSON.stringify(r).toUpperCase();

    const status =
      text.toLowerCase();

    if(
      !status.includes("andamento")
    ) return;

    EMPREGADOS.forEach(emp=>{

      if(text.includes(emp)){
        ocupados.add(emp);
      }
    });
  });

  document.getElementById(
    "status-empregados"
  ).innerHTML =

    EMPREGADOS.map(nome=>`

      <span class="
        badge
        ${ocupados.has(nome)
          ? "ocupado"
          : "livre"}
      ">

        ${nome}

        (${ocupados.has(nome)
          ? "OCUPADO"
          : "LIVRE"})

      </span>

    `).join("");
}

/* ================= APP ================= */

let lastHash = "";
let isFirstLoad = true;

async function loadAll(){

  const app =
    document.getElementById("app");

  try{

    const results =
      await Promise.all(
        TABS.map(
          t => fetchSheet(t.sheet)
        )
      );

    const currentHash =
      JSON.stringify(results);

    if(
      !isFirstLoad &&
      currentHash !== lastHash
    ){
      playBeep();
    }

    lastHash = currentHash;
    isFirstLoad = false;

    app.innerHTML = "";

    /* ================= GERAL ================= */

    const geralRows =
      results[0].table.rows || [];

    const grid =
      document.createElement("div");

    grid.className =
      "grid-geral";

    /* VEÍCULOS */

    const veiculosCard =
      document.createElement("section");

    veiculosCard.className =
      "card";

    veiculosCard.innerHTML = `

      <h2>VEÍCULOS</h2>

      ${renderTable({

        headers:[
          "TRAIL TXN1I89",
          "CRETA TXJ6F18",
          "CRETA TXJ6F19",
          "CRETA TXJ6F20"
        ],

        rows:geralRows.map(r=>({

          c:(r.c || []).slice(0,4)

        }))
      })}
    `;

    /* MOTORISTAS */

    const motoristasCard =
      document.createElement("section");

    motoristasCard.className =
      "card";

    motoristasCard.innerHTML = `

      <h2>MOTORISTAS</h2>

      ${renderTable({

        headers:[
          "CACIO",
          "CELSO",
          "NEI"
        ],

        rows:geralRows.map(r=>({

          c:(r.c || []).slice(4,7)

        }))
      })}
    `;

    grid.appendChild(
      veiculosCard
    );

    grid.appendChild(
      motoristasCard
    );

    app.appendChild(grid);

    /* ================= OUTRAS TABELAS ================= */

    results.slice(1).forEach((data,index)=>{

      const tab =
        TABS[index + 1];

      const rows =
        data.table.rows || [];

      if(index === 0){
        renderEmpregados(rows);
      }

      const section =
        document.createElement("section");

      section.className =
        "card";

      section.innerHTML = `

        <h2>${tab.title}</h2>

        ${renderTable({
          headers:tab.headers,
          rows
        })}
      `;

      app.appendChild(section);
    });

  }catch(err){

    console.error(err);

    app.innerHTML =
      "<div>Erro ao carregar dados.</div>";
  }
}

/* ================= CLOCK ================= */

function updateClock(){

  const now =
    new Date();

  document.getElementById(
    "clock"
  ).innerText =

    now.toLocaleDateString(
      "pt-BR"
    ) +

    " — " +

    now.toLocaleTimeString(
      "pt-BR",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
}

updateClock();

setInterval(
  updateClock,
  1000
);

/* ================= AUDIO ================= */

const audio =
  document.getElementById("beep");

const btnAudio =
  document.getElementById("toggle-audio");

let soundOn = true;

btnAudio.onclick = ()=>{

  soundOn = !soundOn;

  btnAudio.innerText =

    soundOn
      ? "🔊 SOM ON"
      : "🔇 SOM OFF";

  btnAudio.classList.toggle(
    "off",
    !soundOn
  );
};

function playBeep(){

  if(!soundOn) return;

  audio.currentTime = 0;

  audio.play().catch(()=>{});
}

/* ================= FULLSCREEN ================= */

document.getElementById(
  "toggle-fullscreen"
).onclick = async ()=>{

  if(!document.fullscreenElement){

    await document.documentElement
      .requestFullscreen();

  }else{

    await document.exitFullscreen();
  }
};

/* ================= INIT ================= */

loadAll();

setInterval(
  loadAll,
  CONFIG.REFRESH_INTERVAL
);

</script>

</body>
</html>
