```html
<!doctype html>
<html lang="pt-BR">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Painel Frota</title>

<style>

:root{
  --bg:#071029;
  --card:#0b1a3a;
  --table:#0e224d;
  --table2:#0c1d40;
  --header:#2c4078;
  --border:#1e2f5c;

  --white:#fff;
  --green:#00ff9c;
  --red:#ff4d4d;
  --blue:#4da6ff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--white);
  font-family:Arial,sans-serif;
  height:100vh;
  overflow:hidden;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 20px;
  background:#020617;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
  height:60px;
}

.title{
  font-size:28px;
  font-weight:700;
}

#clock{
  font-size:22px;
  font-weight:700;
}

main{
  display:grid;
  gap:14px;
  padding:12px;
  height:calc(100vh - 95px);
  overflow:auto;
}

.grid-geral{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  background:var(--card);
  border-radius:16px;
  overflow:auto;
  border:1px solid rgba(255,255,255,.08);
}

.card h2{
  text-align:center;
  padding:10px;
  font-size:22px;
}

table{
  width:100%;
  border-collapse:collapse;
}

thead th{
  background:var(--header);
  padding:12px;
  border:1px solid var(--border);
  font-size:18px;
}

tbody td{
  padding:12px;
  border:1px solid var(--border);
  background:var(--table);
  text-align:center;
  font-size:22px;
  font-weight:700;
}

tbody tr:nth-child(even) td{
  background:var(--table2);
}

.status-manutencao{
  color:var(--blue);
}

.status-ocupado{
  color:var(--red);
}

.status-livre{
  color:var(--green);
}

@media(max-width:768px){

  .grid-geral{
    grid-template-columns:1fr;
  }

  .title{
    font-size:14px;
  }

  #clock{
    font-size:12px;
  }

  .logo{
    height:28px;
  }

  thead th,
  tbody td{
    font-size:10px;
    padding:6px;
  }
}

</style>

</head>

<body>

<header class="topbar">

  <img
    src="logo.png"
    class="logo"
    onerror="this.style.display='none'"
  >

  <div class="title">
    MOVIMENTAÇÃO DIÁRIA
  </div>

  <div id="clock"></div>

</header>

<main id="app"></main>

<script>

const CONFIG = {

  SHEET_ID:
    "1Ch3AjQ0MDo4WuQWFDR3r8nZrHb4yQkSLOtT5_QgxT6E",

  REFRESH_INTERVAL:30000
};

const TABS = [

  {
    sheet:"GERAL"
  },

  {
    title:"PAINEL",
    sheet:"PAINEL",

    headers:[
      "Data",
      "Hora",
      "Veículo",
      "Empregado",
      "Passageiro / Motivo",
      "Itinerário",
      "Status"
    ]
  },

  {
    title:"AGENDA DO DIA",
    sheet:"AGENDA DO DIA",

    headers:[
      "Data",
      "Hora",
      "Passageiro",
      "Setor",
      "Motivo",
      "Itinerário",
      "Status"
    ]
  },

  {
    title:"AGENDA SERVIÇO SOCIAL",
    sheet:"AGENDA SERVIÇO SOCIAL",

    headers:[
      "Data",
      "Período",
      "Passageiro",
      "Motivo",
      "Itinerário",
      "Status"
    ]
  }
];

const parseGviz = txt =>

  JSON.parse(
    txt.slice(
      txt.indexOf("{"),
      txt.lastIndexOf("}") + 1
    )
  );

const getValue = c =>
  c?.f ?? c?.v ?? "";

async function fetchSheet(sheet){

  const url =

    `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq`+

    `?sheet=${encodeURIComponent(sheet)}`+

    `&tqx=out:json`;

  const res = await fetch(url);

  return parseGviz(await res.text());
}

function getClass(v){

  const t =
    String(v).toLowerCase();

  if(t.includes("manutenção"))
    return "status-manutencao";

  if(t.includes("ocupado"))
    return "status-ocupado";

  if(t.includes("livre"))
    return "status-livre";

  return "";
}

function renderTable(headers,rows){

  return `

    <table>

      <thead>
        <tr>
          ${headers.map(h=>`
            <th>${h}</th>
          `).join("")}
        </tr>
      </thead>

      <tbody>

        ${rows.map(r=>`

          <tr>

            ${(r.c || []).map(c=>`

              <td class="${getClass(getValue(c))}">
                ${getValue(c)}
              </td>

            `).join("")}

          </tr>

        `).join("")}

      </tbody>

    </table>
  `;
}

async function loadAll(){

  const app =
    document.getElementById("app");

  const results =
    await Promise.all(
      TABS.map(t =>
        fetchSheet(t.sheet)
      )
    );

  app.innerHTML = "";

  const geral =
    results[0].table.rows || [];

  const grid =
    document.createElement("div");

  grid.className =
    "grid-geral";

  const veiculos =
    document.createElement("section");

  veiculos.className =
    "card";

  veiculos.innerHTML = `

    <h2>VEÍCULOS</h2>

    ${renderTable(

      [
        "TRAIL TXN1I89",
        "CRETA TXJ6F18",
        "CRETA TXJ6F19",
        "CRETA TXJ6F20"
      ],

      geral.map(r=>({
        c:[
          r.c?.[0] || {v:""},
          r.c?.[1] || {v:""},
          r.c?.[2] || {v:""},
          r.c?.[3] || {v:""}
        ]
      }))
    )}

  `;

  const motoristas =
    document.createElement("section");

  motoristas.className =
    "card";

  motoristas.innerHTML = `

    <h2>MOTORISTAS</h2>

    ${renderTable(

      [
        "CACIO",
        "CELSO",
        "NEI"
      ],

      geral.map(r=>({
        c:[
          r.c?.[4] || {v:""},
          r.c?.[5] || {v:""},
          r.c?.[6] || {v:""}
        ]
      }))
    )}

  `;

  grid.appendChild(veiculos);
  grid.appendChild(motoristas);

  app.appendChild(grid);

  results.slice(1).forEach((data,i)=>{

    const tab =
      TABS[i + 1];

    const section =
      document.createElement("section");

    section.className =
      "card";

    section.innerHTML = `

      <h2>${tab.title}</h2>

      ${renderTable(
        tab.headers,
        data.table.rows || []
      )}

    `;

    app.appendChild(section);
  });
}

function updateClock(){

  document.getElementById(
    "clock"
  ).innerText =

    new Date().toLocaleString(
      "pt-BR",
      {
        dateStyle:"short",
        timeStyle:"short"
      }
    );
}

updateClock();

setInterval(updateClock,1000);

loadAll();

setInterval(
  loadAll,
  CONFIG.REFRESH_INTERVAL
);

</script>

</body>
</html>
```
