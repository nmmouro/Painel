<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Painel Frota</title>

<style>

:root{
  --bg:#071029;
  --card:#0b1a3a;
  --table:#0e224d;
  --table2:#0c1d40;
  --header:#2c4078;
  --border:#1e2f5c;

  --white:#fff;
  --green:#00ff9c;
  --red:#ff4d4d;
  --blue:#4da6ff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--white);
  font-family:Arial,sans-serif;
  height:100vh;
  overflow:hidden;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:12px 20px;
  background:#020617;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
  height:55px;
}

.title{
  font-size:28px;
  font-weight:700;
}

.right{
  display:flex;
  align-items:center;
  gap:10px;
}

#clock{
  font-size:20px;
  font-weight:700;
}

button{
  border:none;
  border-radius:10px;
  padding:8px 12px;
  cursor:pointer;
  font-weight:700;
}

.off{
  background:#ff4d4d;
  color:#fff;
}

main{
  display:grid;
  gap:10px;
  padding:10px;
  height:calc(100vh - 90px);
  overflow:auto;
}

.grid-geral{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:10px;
}

.card{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
}

.card h2{
  text-align:center;
  padding:10px;
  font-size:22px;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

thead th{
  background:var(--header);
  padding:10px;
  border:1px solid var(--border);
  font-size:18px;
  white-space:nowrap;
}

tbody th{
  background:var(--header);
  padding:10px;
  border:1px solid var(--border);
  font-size:18px;
  white-space:nowrap;
}

tbody td{
  padding:10px;
  border:1px solid var(--border);
  background:var(--table);
  text-align:center;
  font-size:20px;
  font-weight:700;
  white-space:nowrap;
}

tbody tr:nth-child(even) td{
  background:var(--table2);
}

.status-manutencao{
  color:var(--blue);
}

.status-ocupado{
  color:var(--red);
}

.status-livre{
  color:var(--green);
}

@media(max-width:768px){

  .grid-geral{
    grid-template-columns:1fr;
  }

  .title{
    font-size:14px;
  }

  .logo{
    height:28px;
  }

  #clock{
    font-size:11px;
  }

  button{
    font-size:10px;
    padding:4px 6px;
  }

  thead th,
  tbody th,
  tbody td{
    font-size:10px;
    padding:6px;
  }
}

</style>

</head>

<body>

<audio id="beep" preload="auto">
  <source src="./alerta.mp3" type="audio/mpeg">
</audio>

<header class="topbar">

  <img
    src="logo.png"
    class="logo"
    onerror="this.style.display='none'"
  >

  <div class="title">
    MOVIMENTAÇÃO DIÁRIA
  </div>

  <div class="right">

    <div id="clock"></div>

    <button id="toggle-audio">
      🔊 SOM
    </button>

    <button id="toggle-fullscreen">
      ⛶ TELA
    </button>

  </div>

</header>

<main id="app"></main>

<script>

/* ================= CONFIG ================= */

const CONFIG = {

  SHEET_ID:
    "1Ch3AjQ0MDo4WuQWFDR3r8nZrHb4yQkSLOtT5_QgxT6E",

  REFRESH_INTERVAL:30000
};

/* ================= TABS ================= */

const TABS = [

  { sheet:"GERAL" },

  {
    title:"PAINEL",
    sheet:"PAINEL",

    headers:[
      "Data",
      "Hora",
      "Veículo",
      "Empregado",
      "Passageiro",
      "Itinerário",
      "Status"
    ]
  },

  {
    title:"AGENDA DO DIA",
    sheet:"AGENDA DO DIA",

    headers:[
      "Data",
      "Hora",
      "Passageiro",
      "Setor",
      "Motivo",
      "Itinerário",
      "Status"
    ]
  },

  {
    title:"AGENDA SERVIÇO SOCIAL",
    sheet:"AGENDA SERVIÇO SOCIAL",

    headers:[
      "Data",
      "Período",
      "Passageiro",
      "Motivo",
      "Itinerário",
      "Status"
    ]
  }
];

/* ================= HELPERS ================= */

const parse = txt =>

  JSON.parse(
    txt.slice(
      txt.indexOf("{"),
      txt.lastIndexOf("}") + 1
    )
  );

const val = c =>
  c?.f ?? c?.v ?? "";

/* ================= FETCH ================= */

async function fetchSheet(sheet){

  const url =

    `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq`+

    `?sheet=${encodeURIComponent(sheet)}`+

    `&tqx=out:json`;

  return parse(
    await (await fetch(url)).text()
  );
}

/* ================= STATUS ================= */

function getClass(v){

  const t =
    String(v).toLowerCase();

  if(t.includes("manutenção"))
    return "status-manutencao";

  if(t.includes("ocupado"))
    return "status-ocupado";

  if(t.includes("livre"))
    return "status-livre";

  return "";
}

/* ================= TABELAS NORMAIS ================= */

function renderTable(headers, rows){

  const validRows = rows.filter(r =>

    (r.c || []).some(c =>
      String(val(c)).trim() !== ""
    )
  );

  return `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            ${headers.map(h => `
              <th>${h}</th>
            `).join("")}

          </tr>

        </thead>

        <tbody>

          ${validRows.map(r => `

            <tr>

              ${(r.c || []).map(c => `

                <td class="${getClass(val(c))}">
                  ${val(c)}
                </td>

              `).join("")}

            </tr>

          `).join("")}

        </tbody>

      </table>

    </div>
  `;
}

/* ================= TABELAS VERTICAIS ================= */

function renderVerticalTable(headers, rows, indexes){

  let html = `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>VEÍCULOS</th>

            ${rows.map(() => `
              <th>STATUS</th>
              <th>ODÔMETRO</th>
              <th>COMBUSTÍVEL</th>
            `).join("")}

          </tr>

        </thead>

        <tbody>

  `;

  headers.forEach((header, colIndex) => {

    html += `

      <tr>

        <th>${header}</th>

    `;

    rows.forEach(row => {

      const base =
        indexes[colIndex];

      const status =
        row.c?.[base] || { v:"" };

      const odometro =
        row.c?.[base + 1] || { v:"" };

      const combustivel =
        row.c?.[base + 2] || { v:"" };

      html += `

        <td class="${getClass(val(status))}">
          ${val(status)}
        </td>

        <td>
          ${val(odometro)}
        </td>

        <td>
          ${val(combustivel)}
        </td>

      `;
    });

    html += `</tr>`;
  });

  html += `

        </tbody>

      </table>

    </div>

  `;

  return html;
}

/* ================= CARD VERTICAL ================= */

function createCard(title, headers, rows, indexes){

  let html = `

    <section class="card">

      <h2>${title}</h2>

      <div class="table-wrap">

        <table>

  `;

  /* ================= VEÍCULOS ================= */

  if(title === "VEÍCULOS"){

    html += `

      <thead>

        <tr>

          <th>VEÍCULOS</th>
          <th>STATUS</th>
          <th>ODÔMETRO</th>
          <th>COMBUSTÍVEL</th>

        </tr>

      </thead>

      <tbody>

    `;

    headers.forEach((header, idx) => {

      const coluna = indexes[idx];

      html += `

        <tr>

          <td>${header}</td>

          <td class="${getClass(
            val(rows[0]?.c?.[coluna] || {v:""})
          )}">
            ${val(rows[0]?.c?.[coluna] || {v:""})}
          </td>

          <td>
            ${val(rows[1]?.c?.[coluna] || {v:""})}
          </td>

          <td>
            ${val(rows[2]?.c?.[coluna] || {v:""})}
          </td>

        </tr>

      `;
    });

    html += `</tbody>`;
  }

  /* ================= MOTORISTAS ================= */

  if(title === "MOTORISTAS"){

    html += `

      <thead>

        <tr>

          <th>MOTORISTAS</th>
          <th>STATUS</th>
          <th>OUTROS</th>

        </tr>

      </thead>

      <tbody>

    `;

    headers.forEach((header, idx) => {

      const coluna = indexes[idx];

      html += `

        <tr>

          <td>${header}</td>

          <td class="${getClass(
            val(rows[0]?.c?.[coluna] || {v:""})
          )}">
            ${val(rows[0]?.c?.[coluna] || {v:""})}
          </td>

          <td>
            ${val(rows[1]?.c?.[coluna] || {v:""})}
          </td>

        </tr>

      `;
    });

    html += `</tbody>`;
  }

  html += `

        </table>

      </div>

    </section>

  `;

  return html;
}
  
/* ================= AUDIO ================= */

let lastHash = "";
let firstLoad = true;

const audio =
  document.getElementById("beep");

let soundOn = true;

document.getElementById(
  "toggle-audio"
).onclick = ()=>{

  soundOn = !soundOn;

  document
    .getElementById("toggle-audio")
    .classList.toggle("off", !soundOn);
};

function beep(){

  if(!soundOn) return;

  audio.currentTime = 0;

  audio.play().catch(()=>{});
}

/* ================= FULLSCREEN ================= */

document.getElementById(
  "toggle-fullscreen"
).onclick = async ()=>{

  if(!document.fullscreenElement){

    await document.documentElement
      .requestFullscreen();

  }else{

    await document.exitFullscreen();
  }
};

/* ================= LOAD ================= */

async function loadAll(){

  const app =
    document.getElementById("app");

  try{

    const results =
      await Promise.all(
        TABS.map(t =>
          fetchSheet(t.sheet)
        )
      );

    const hash =
      JSON.stringify(results);

    if(!firstLoad && hash !== lastHash){
      beep();
    }

    firstLoad = false;
    lastHash = hash;

    app.innerHTML = "";

    /* ================= GERAL ================= */

    const geralRows =
      results[0].table.rows || [];

    const grid =
      document.createElement("div");

    grid.className =
      "grid-geral";

    grid.innerHTML =

      createCard(

        "VEÍCULOS",

        [
          "TRAIL TXN1I89",
          "CRETA TXJ6F18",
          "CRETA TXJ6F19",
          "CRETA TXJ6F20"
        ],

        geralRows,

        [0,1,2,3]
      )

      +

      createCard(

        "MOTORISTAS",

        [
          "CACIO",
          "CELSO",
          "NEI"
        ],

        geralRows,

        [4,5,6]
      );

    app.appendChild(grid);

    /* ================= OUTRAS TABELAS ================= */

    results.slice(1).forEach((d,i)=>{

      const tab =
        TABS[i + 1];

      const card =
        document.createElement("section");

      card.className = "card";

      card.innerHTML = `

        <h2>${tab.title}</h2>

        ${renderTable(
          tab.headers,
          d.table.rows || []
        )}

      `;

      app.appendChild(card);
    });

  }catch(err){

    console.error(err);

    app.innerHTML =
      "<div style='padding:20px'>Erro ao carregar dados.</div>";
  }
}

/* ================= CLOCK ================= */

function updateClock(){

  document.getElementById(
    "clock"
  ).innerText =

    new Date().toLocaleString(
      "pt-BR",
      {
        dateStyle:"short",
        timeStyle:"short"
      }
    );
}

updateClock();

setInterval(updateClock,1000);

/* ================= INIT ================= */

loadAll();

setInterval(
  loadAll,
  CONFIG.REFRESH_INTERVAL
);

</script>

</body>

</html>
